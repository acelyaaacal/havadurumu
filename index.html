<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. Geliştirilmiş Başlık (Title) -->
    <title>Hava Durumu - Anlık Güncel Hava Tahminleri</title>
    
    <!-- 2. Google ve Arama Sonuçları İçin Açıklama (Description) - ÇOK ÖNEMLİ -->
    <meta name="description" content="Anlık hava durumu öğrenme uygulaması. İstanbul, Ankara, İzmir ve tüm illerin güncel hava durumu tahminlerini hızlıca öğrenin.">
    
    <!-- 3. Sosyal Medyada Paylaşıldığında Şık Görünmesi İçin (Open Graph) -->
    <meta property="og:title" content="Hava Durumu - Anlık Güncel Hava Tahminleri">
    <meta property="og:description" content="Tüm şehirlerin anlık hava durumunu hızlıca öğrenin.">
    <meta property="og:type" content="website">
    
    <meta name="author" content="Açelya Çalışkan">
    <link rel="stylesheet" href="index.css">
    </head>
  <body>
  <!-- Animasyonların, Yıldızların ve Çimlerin Görüneceği Katman -->
  <div id="animation-layer"></div>

  <!-- Satürn İmza Alanı -->
  <div class="signature">
    <span class="planet">🪐</span>
    <span class="name">Açelya</span>
  </div>
  
  <!-- Ana Uygulama Konteyneri -->
  <div class="app-container">
    <h1>Hava Durumu</h1>
    <p>Hava durumunu öğrenmek istediğiniz şehrin adını yazınız.</p>
    
    <!-- Arama Kutusu ve Butonu -->
    <div class="search-container">
      <input type="text" id="city" placeholder="Şehir adını giriniz">
      <button id="searchBtn">🔍</button>
    </div>

    <!-- Popüler Şehir Kısayolları -->
    <div class="popular-cities">
      <button class="city-tag" onclick="quickSearch('İzmir')">İzmir</button>
      <button class="city-tag" onclick="quickSearch('İstanbul')">İstanbul</button>
      <button class="city-tag" onclick="quickSearch('Ankara')">Ankara</button>
      <button class="city-tag" onclick="quickSearch('Antalya')">Antalya</button>
    </div>

    <!-- Hava Durumu Kartı -->
    <div id="weather-card">
      <h2 id="city-name"></h2>
      <div id="weather-icon">🌤</div>
      <h1 id="temperature"></h1>
      <p id="description"></p>
      <p id="humidity"></p>
      <p id="wind"></p>
    </div>
  </div>

  <!-- Alt Bilgi (Footer) -->
  <footer>
